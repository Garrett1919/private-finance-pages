<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Finanzen – Banking Callback</title>
</head>
<body style="font-family:sans-serif;padding:24px;line-height:1.5">
  <h2>Bankfreigabe abgeschlossen</h2>
  <p>Du wirst jetzt automatisch zurück zu Pydroid weitergeleitet.</p>
  <p id="fallback" style="display:none">
    Falls nichts passiert, tippe hier:
    <a id="localLink" href="#">Zurück zu Pydroid</a>
  </p>

  <script>
    const target = "http://127.0.0.1:8765/callback" + window.location.search;
    const link = document.getElementById("localLink");
    link.href = target;
    document.getElementById("fallback").style.display = "block";
    setTimeout(() => {
      window.location.replace(target);
    }, 500);
  </script>
</body>
</html>
